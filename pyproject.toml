[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-rocm"
version = "0.2.0"
description = "nano-vllm fork adapted for AMD ROCm on Windows (RX 9070 / gfx1201)"
requires-python = ">=3.12,<3.13"
# 依赖为何与上游不同(2026-09-30 调研,详见 ../nano-vllm/research/):
# - flash-attn 删除:ROCm/PyPI/官方索引均无 Windows wheel,attention 改走 triton/SDPA(本工作区唯一代码改动)
# - triton 用 triton-windows 3.7.1.post27:本机探针实测通过 store_kvcache 同款 scatter kernel 的版本
# - 其余小包锁定教学环境验证过的版本,减少变量
dependencies = [
    "torch==2.13.0+rocm10.0.0",
    "amd-torch-device-gfx1201==2.13.0+rocm10.0.0",
    "triton-windows==3.7.1.post27",
    "transformers==5.17.0",
    "xxhash==4.0.1",
    "numpy==2.5.3",
    "safetensors==0.8.0",
    "tqdm==4.70.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

# torch+rocm10.0.0 只在 AMD 的 whl-next 索引上。
# tool.uv.sources 的 index 映射只对「直接依赖」生效,传递依赖(rocm-sdk-*)
# 仍会回退 PyPI;而 uv 默认"第一个含该包的索引说了算",PyPI 上恰有同名低版本
# 会把 AMD 版挡掉。两个索引都是我们自己指定的可信源,故开 unsafe-best-match
# 让 uv 合并考虑两边(这是 AMD 官方文档对 whl-next 的推荐用法)。
[[tool.uv.index]]
url = "https://stable.repo.amd.com/rocm/whl-next/"
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.uv]
# 让 uv 合并考虑 AMD 索引与 PyPI 两边的版本(两索引均为本文件显式指定的可信源)
index-strategy = "unsafe-best-match"

# 覆写 torch 的 triton 依赖:只在 Linux 上要,Windows 上不要。
# 为什么需要这行(2026-09-30 实测):
#   uv 解析时读到的 torch 元数据把 triton 当作无条件依赖(它拿的是 Linux wheel 的
#   METADATA / PEP 658 sidecar),于是 uv sync 要装 triton==3.8.0+git…rocm10.0.0——
#   那是 AMD fork,只有 linux_x86_64 wheel,Windows 上必然失败。
#   但本机 ComfyUI 里同款 win_amd64 wheel 的实际 METADATA 全量扫描确认:
#   torch-2.13.0+rocm10.0.0 **没有** Requires-Dist: triton(triton 只出现在文档段)。
#   即"win wheel 不需要 triton"是事实,uv 被平台混合元数据误导。
#   triton 由下面的 triton-windows 提供(import 名同为 triton),torch.compile 路径
#   本项目用 enforce_eager 语义绕开,不依赖 AMD triton fork。
override-dependencies = ["triton; sys_platform == 'linux'"]
